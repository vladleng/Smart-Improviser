name: Windows Build

on:
  push:
    branches:
      - main
      - release-0.3
      - stage-1-ara-context-monitor
      - stage-2-harmonic-engine
      - stage-2-pattern-recognizer
      - stage-2-tritone-substitution
      - stage-2-local-key-center
      - stage-2-ambiguity-confidence
      - stage-2-integration-validation
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 18 2026" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Prepare drop-in VST3 package
        shell: pwsh
        run: |
          $source = "build/SmartImproviserARA_artefacts/Release/VST3/Smart Improviser.vst3"
          $packageRoot = "package"
          $destination = Join-Path $packageRoot "Smart Improviser.vst3"

          if (-not (Test-Path $source)) {
            throw "Built VST3 package not found: $source"
          }

          if (Test-Path $packageRoot) {
            Remove-Item $packageRoot -Recurse -Force
          }

          New-Item -ItemType Directory -Path $packageRoot | Out-Null
          Copy-Item $source $destination -Recurse

      - name: Upload Smart Improviser 0.3f fix2 VST3
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Improviser-0.3f-fix2-Windows
          path: package
          if-no-files-found: error
