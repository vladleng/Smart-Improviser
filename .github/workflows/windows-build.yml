name: Windows Build

on:
  push:
    branches:
      - main
      - stage-1-ara-context-monitor
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 18 2026" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload Smart Improviser 0.1a VST3
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Improviser-0.1a-Windows
          path: build/SmartImproviserARA_artefacts/Release/VST3/Smart Improviser ARA.vst3
          if-no-files-found: error
